name: Mirror upstream releases

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many of the newest releases to consider"
        required: false
        default: "100"

permissions:
  contents: write
  pages: write

concurrency: build

env:
  UP: aliasfoxkde/FireCraft
  APP: firecraft
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror new releases
        run: |
          # Each upstream release ships its finished web app as firecraft-web-<version>.zip. Unpack that, and point the
          # root-absolute paths in it at this version's own folder so it works from a subfolder.
          tags=$(gh release list -R "$UP" --limit "${{ inputs.limit || '100' }}" --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName')
          for tag in $tags; do
            ver="${tag#v}"
            [ -d "v$ver" ] && { bash scripts/skip.sh del "$ver"; continue; }
            asset="firecraft-web-$ver.zip"
            tmp=$(mktemp -d)
            if ! gh release download "$tag" -R "$UP" -p "$asset" -D "$tmp"; then echo "No web bundle on $tag"; bash scripts/skip.sh add "$ver" "The author published no browser build for this release."; continue; fi
            mkdir "v$ver"
            unzip -q "$tmp/$asset" -d "v$ver" -x '__MACOSX/*' '*.DS_Store'
            [ -f "v$ver/index.html" ] || { echo "::warning::$asset has no index.html"; bash scripts/skip.sh add "$ver" "Its browser build has no index.html, so it can't be opened."; rm -rf "v$ver"; continue; }
            P="/$APP/v$ver"
            # The page loads the app's script and WebAssembly by root-absolute paths; the host page frames /index.html.
            sed -i -E "s#([\"'])/(firecraft-web-[0-9a-f]+(_bg)?\.(js|wasm))#\1$P/\2#g" "v$ver/index.html"
            [ -f "v$ver/host.html" ] && sed -i "s#src=\"/index.html\"#src=\"$P/index.html\"#" "v$ver/host.html"
            # Anything still pointing at the site root would 404 here.
            if grep -Eq "[\"'](/firecraft-web-|/index\.html)" "v$ver/index.html" "v$ver/host.html" 2>/dev/null; then echo "::warning::root-absolute paths remain in v$ver"; fi
            for f in LICENSE-MIT LICENSE-APACHE; do curl -sSfL "https://raw.githubusercontent.com/$UP/$tag/$f" -o "v$ver/$f" || true; done
            printf 'Unpacked from %s, asset %s, release %s\nhttps://github.com/%s/releases/tag/%s\nOne change: root-absolute paths in index.html and host.html were prefixed with /%s/v%s so the app works from a subfolder.\nFireCraft is MIT OR Apache-2.0; the full source for this version is at https://github.com/%s/tree/%s\n' "$UP" "$asset" "$tag" "$UP" "$tag" "$APP" "$ver" "$UP" "$tag" > "v$ver/SOURCE.txt"
            rm -rf "$tmp"
          done

      - name: Update latest and versions.json
        run: |
          versions=$(find . -maxdepth 1 -type d -name 'v[0-9]*' -printf '%f\n' | sed 's/^v//' | sort -rV)
          [ -n "$versions" ] || { echo "No versions"; exit 0; }
          latest=$(echo "$versions" | head -n1)
          mkdir -p latest
          printf '<!doctype html><meta charset="utf-8"><title>%s</title><meta http-equiv="refresh" content="0; url=../v%s/"><link rel="canonical" href="../v%s/"><a href="../v%s/">Open %s %s</a>\n' "$APP" "$latest" "$latest" "$latest" "$APP" "$latest" > latest/index.html
          echo "$versions" | jq -R . | jq -s --arg latest "$latest" '{latest: $latest, versions: .}' > versions.json
          cat versions.json

      - name: Keep the site under its size cap
        run: bash scripts/prune.sh

      - name: Commit and request a Pages build
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mirror upstream release"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
